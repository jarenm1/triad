[package]
name = "triad-showcase"
version = "0.1.0"
edition = "2024"
description = "Scripted drone showcase runner for the Triad site demo"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "triad-showcase"
path = "src/main.rs"

[dependencies]
triad-gpu = { workspace = true }
triad-window = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
